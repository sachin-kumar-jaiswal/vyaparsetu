<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F5EE"/>
      <stop offset="100%" stop-color="#176B45"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Product Canvas -->
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="360" rx="16" fill="#FFFFFF" opacity="0.4"/>

  <!-- Category Chip -->
  <rect x="35" y="35" width="130" height="26" rx="13" fill="#176B45" />
  <text x="100" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">GROCERY</text>

  <!-- Verification Badge -->
  <circle cx="345" cy="48" r="14" fill="#F1B84B" />
  <path d="M339 48 L343 52 L351 44" fill="none" stroke="#202820" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Product Container -->
  <g filter="url(#shadow)">
    <rect x="90" y="90" width="220" height="220" rx="28" fill="#FFFFFF" stroke="#E2E4DE" stroke-width="2"/>
    <!-- Product Graphic Accent -->
    <circle cx="200" cy="180" r="65" fill="#E8F5EE" opacity="0.35"/>
    <rect x="135" y="130" width="130" height="100" rx="16" fill="#176B45" opacity="0.85"/>
    <text x="200" y="185" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" text-anchor="middle">Verified</text>
  </g>

  <!-- Product Labels -->
  <text x="200" y="338" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="17" fill="#202820" text-anchor="middle">VyaparSetu Product</text>
  <rect x="150" y="352" width="100" height="22" rx="11" fill="#F0F2EB" />
  <text x="200" y="367" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="12" fill="#525B53" text-anchor="middle">Standard Pack</text>
</svg>
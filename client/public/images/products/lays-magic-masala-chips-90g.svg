<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFFAFE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <rect x="18" y="18" width="364" height="364" rx="16" fill="#FFFFFF" opacity="0.5"/>

  <!-- Category Badge -->
  <rect x="30" y="32" width="130" height="24" rx="12" fill="#176B45" />
  <text x="95" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="10.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">SNACKS & PACKAGED FOOD</text>

  <!-- Verified Seal -->
  <circle cx="348" cy="44" r="14" fill="#F1B84B" />
  <path d="M342 44 L346 48 L354 40" fill="none" stroke="#202820" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Card Illustration -->
  <g filter="url(#shadow)">
    <rect x="90" y="85" width="220" height="220" rx="24" fill="#FFFFFF" stroke="#E2E4DE" stroke-width="2"/>
    <circle cx="200" cy="175" r="65" fill="#CFFAFE" opacity="0.4"/>
    <rect x="135" y="135" width="130" height="85" rx="14" fill="#0284C7" opacity="0.9"/>
    <text x="200" y="186" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle">Lay's</text>
  </g>

  <!-- Name & Pack Label -->
  <text x="200" y="336" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="16" fill="#202820" text-anchor="middle">Lay's India's Magic Masala Potato Chips</text>
  <rect x="150" y="350" width="100" height="22" rx="11" fill="#F0F2EB" />
  <text x="200" y="365" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11.5" fill="#525B53" text-anchor="middle">90 g Party Bag</text>
</svg>
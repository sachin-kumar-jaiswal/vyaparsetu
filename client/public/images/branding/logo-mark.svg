<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#176B45"/>
      <stop offset="100%" stop-color="#0F4C30"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1B84B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#primaryGrad)" />
  <!-- Bridge Arch representing 'Setu' (Bridge) -->
  <path d="M22 68 C 22 40, 78 40, 78 68" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <!-- Marketplace Pillar / V shape -->
  <path d="M34 32 L 50 62 L 66 32" fill="none" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Golden grain / spark dot at the summit -->
  <circle cx="50" cy="24" r="5" fill="#F1B84B" />
</svg>
